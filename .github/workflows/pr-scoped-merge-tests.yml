name: Synthetic PR-scoped decision tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-pr-scoped-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the read-only decision with separate synthetic keys
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
