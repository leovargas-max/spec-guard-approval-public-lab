name: Synthetic owner receipt

on:
  pull_request_target:
    branches: [main, lab/receipt-baseline]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  public-lab-signed-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run fixture tests from the trusted base
        run: python3 -m unittest discover -s scripts -p test_spec_guard_approval.py
      - name: Evaluate current receipt for this PR event
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_PR: ${{ github.event.pull_request.number }}
          LAB_OWNER: ${{ github.repository_owner_id }}
          LAB_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/verify_public_lab.py
